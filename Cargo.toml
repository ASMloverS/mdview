[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
description = "A terminal markdown renderer with a TUI file browser and CSS themes"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = "5"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
